<!DOCTYPE html>
<!-- Mini-League HQ · SITE VERSION 10 · Email round-up tables rendered as images.
     The version also prints in the page footer, so you can confirm at a glance
     which build is actually live without digging through the source. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini-League HQ</title>
<style>
  :root {
    --surface-1: #fcfcfb;
    --plane: #f9f9f7;
    --text-primary: #1a0420;
    --text-secondary: #55415b;
    --muted: #7e6b84;
    --grid: #e7dfeb;
    --axis: #cfc2d5;
    --border: rgba(26,4,32,0.12);
    /* Series hues are Premier League brand families stepped for THIS surface -
       validated: lightness band, chroma floor, CVD separation, contrast. The
       neon brand greens/cyans are accents only; as large fills they glare. */
    --series-1: #00875a;
    --series-2: #1f6fa8;
    --series-3: #c4004a;
    --series-4: #7a3fd1;
    --series-5: #8f6200;
    --context: #c3b5c9;
    --brand-purple: #37003c;
    --accent: #00a862;
    --accent-2: #0090a8;
    --good: #00875a;
    --warning: #9a6400;
    --critical: #c4004a;
    --success-text: #006b47;
    --seq-100:#f0e2f7; --seq-250:#d3aee6; --seq-400:#a865cf; --seq-550:#7a3fa8; --seq-700:#4a1f6b;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --surface-1: #2a0730;
    --plane: #1a0420;
    --text-primary: #ffffff;
    --text-secondary: #cbb6d1;
    --muted: #9b83a3;
    --grid: #3d1a45;
    --axis: #4f2a58;
    --border: rgba(255,255,255,0.13);
    --series-1: #00b06e;
    --series-2: #2e97cc;
    --series-3: #e90052;
    --series-4: #9b5fe8;
    --series-5: #c07e00;
    --context: #5a3d62;
    --brand-purple: #37003c;
    --accent: #00ff87;
    --accent-2: #04f5ff;
    --good: #00ff87;
    --warning: #ffb020;
    --critical: #ff5c8a;
    --success-text: #00ff87;
    --seq-100:#f0d9fb; --seq-250:#d9a8f0; --seq-400:#b06fd6; --seq-550:#8a3fb0; --seq-700:#5f1f77;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--text-primary);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 80px; }

  header.top {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 20px;
    padding-bottom: 18px; border-bottom: 1px solid var(--border); margin-bottom: 22px;
  }
  header.top h1 { font-size: 24px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .sub { color: var(--text-secondary); font-size: 13.5px; }
  .spacer { flex: 1 1 auto; }
  button.ghost {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-secondary); cursor: pointer;
  }
  button.ghost:hover { color: var(--text-primary); border-color: var(--axis); }

  nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 22px; }
  nav.tabs button {
    font: inherit; font-size: 13.5px; padding: 7px 14px; border-radius: 999px;
    border: 1px solid transparent; background: transparent;
    color: var(--text-secondary); cursor: pointer;
  }
  nav.tabs button:hover { background: var(--surface-1); color: var(--text-primary); }
  nav.tabs button[aria-selected="true"] {
    background: var(--surface-1); border-color: var(--border);
    color: var(--text-primary); font-weight: 600;
  }

  section.panel { display: none; }
  section.panel.active { display: block; }

  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 18px;
  }
  .card > h2 {
    font-size: 15px; margin: 0 0 4px; font-weight: 650; letter-spacing: -0.005em;
  }
  .card > .note { color: var(--muted); font-size: 12.5px; margin: 0 0 16px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .kpi .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .kpi .value { font-size: 27px; font-weight: 650; line-height: 1.15; margin-top: 6px; letter-spacing: -0.02em; }
  .kpi .meta { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px;
       text-transform: uppercase; letter-spacing: .05em; padding: 0 10px 8px 0;
       border-bottom: 1px solid var(--grid); white-space: nowrap; }
  td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  /* Right-aligned numbers keep their own gutter on the left so a following
     text column can never butt up against them. */
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums;
                   padding-right: 0; padding-left: 18px; }
  th.num + th, td.num + td { padding-left: 18px; }
  td.pos { color: var(--muted); font-variant-numeric: tabular-nums; width: 34px; }
  .who { font-weight: 600; }
  .teamname { color: var(--muted); font-size: 12.5px; }
  /* Manager names linking out to their FPL squad. Underline only on hover so a
     table of 37 links does not read as a wall of blue. */
  a.mlink { color: inherit; text-decoration: none; display: block; }
  a.mlink:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  a.mlink:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  @media print { a.mlink { color: inherit; text-decoration: none; } }
  tr.me td { background: color-mix(in srgb, var(--series-1) 7%, transparent); }

  .medal { display:inline-flex; align-items:center; justify-content:center;
           width:20px; height:20px; border-radius:50%; font-size:11px; font-weight:700;
           color:#0b0b0b; }
  .m1 { background:#eda100; } .m2 { background:#c3c2b7; } .m3 { background:#d69a6a; }

  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11.5px;
          border:1px solid var(--border); color: var(--text-secondary); margin-right:4px; }
  .pill.good { color: var(--success-text); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
  .pill.bad  { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 40%, transparent); }

  .delta-up { color: var(--success-text); }
  .delta-dn { color: var(--critical); }

  .chartwrap { position: relative; }
  svg.chart { display:block; width:100%; height:auto; overflow: visible; }
  svg.chart text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .axisline { stroke: var(--axis); stroke-width: 1; }
  .ticklabel { fill: var(--muted); font-size: 11px; }
  .ctxline { stroke: var(--context); stroke-width: 1.25; fill: none; opacity: .55;
             cursor: pointer; transition: opacity .12s, stroke .12s; }
  .ctxline:hover { opacity: 1; stroke: var(--text-secondary); }
  .hiline { stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round;
            pointer-events: none; }
  .himark { stroke: var(--surface-1); stroke-width: 2; pointer-events: none; }
  .endlabel { font-size: 11.5px; font-weight: 600; }
  .bar { rx: 4; }

  .tooltip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
    z-index: 5; white-space: nowrap; color: var(--text-primary);
  }

  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:14px; font-size:12.5px; }
  .legend span.k { display:inline-flex; align-items:center; gap:6px; color: var(--text-secondary); }
  .swatch { width:10px; height:10px; border-radius:3px; flex:none; }

  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
  select, .seg button {
    font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
  }
  select { cursor: pointer; }
  .seg { display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .seg button { border:none; border-radius:0; cursor:pointer; color: var(--text-secondary); }
  .seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--series-1) 12%, transparent);
                                     color: var(--text-primary); font-weight:600; }

  .cols2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px; }
  .cols3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; }
  /* Section banners splitting the page into its two halves. Fame carries the
     brand green, Shame the magenta - the same signal used for negatives
     everywhere else on the site. */
  .hallband { margin: 30px 0 16px; padding: 13px 16px; border-radius: 12px;
              border: 1px solid var(--border); border-left: 4px solid var(--accent);
              background: color-mix(in srgb, var(--brand-purple) 16%, var(--surface-1)); }
  .hallband:first-child { margin-top: 4px; }
  .hallband h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.012em; }
  .hallband p  { margin: 3px 0 0; color: var(--text-secondary); font-size: 12.5px; }
  .hallband.shame { border-left-color: var(--critical); }

  .bracket { display:flex; gap:26px; overflow-x:auto; padding-bottom:8px; }
  .round { min-width: 235px; flex:none; }
  .round h3 { font-size:12px; text-transform:uppercase; letter-spacing:.06em;
              color:var(--muted); margin:0 0 10px; font-weight:600; }
  .tie { border:1px solid var(--border); border-radius:10px; padding:9px 11px; margin-bottom:10px;
         font-size:13px; background: var(--plane); }
  .tie .side { display:flex; justify-content:space-between; gap:10px; padding:2px 0; }
  .tie .side.win { font-weight:650; }
  .tie .side.lose { color: var(--muted); }
  .tie .pts { font-variant-numeric: tabular-nums; }

  /* This box is a preview of an email, so it wears the email's colours - white
     paper and dark ink - in both themes. Rendering it in the site's dark
     palette showed near-black text on aubergine, which was unreadable and told
     you nothing about how the email would actually look. */
  .emailbox {
    background:#ffffff; color:#0b0b0b;
    border:1px solid var(--border); border-radius:10px;
    padding:20px 22px; max-height:560px; overflow:auto;
  }
  .emailbox a { color:#1f6fa8; }
  .emailbox h3 { margin:0 0 4px; font-size:17px; }
  .emailbox h4 { margin:18px 0 6px; font-size:14px; }
  .emailbox p, .emailbox li { font-size:14px; line-height:1.55; }
  .emailbox table { font-size:13.5px; }

  .empty { text-align:center; padding:52px 20px; color: var(--text-secondary); }
  .empty .big { font-size:19px; font-weight:600; color: var(--text-primary); margin-bottom:8px; }

  .foot { margin-top:28px; padding-top:16px; border-top:1px solid var(--border);
          color:var(--muted); font-size:12px; display:flex; flex-wrap:wrap; gap:12px; }

  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
           background:var(--text-primary); color:var(--surface-1); padding:9px 16px;
           border-radius:999px; font-size:13px; opacity:0; transition:.2s; pointer-events:none; z-index:50; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  @media print { nav.tabs, button, .foot { display:none !important; }
                 section.panel { display:block !important; page-break-inside:avoid; } }

  /* ---- Premier League brand treatment ----------------------------------
     The purple masthead and the green/cyan/magenta accent rule are the FPL
     signature. Accents are used on edges, rules and small marks - never as
     large fills, where the neons glare and hurt readability. Every text
     colour still comes from a text token, never a series colour. */

  header.top {
    background: linear-gradient(102deg, #37003c 0%, #4b0a55 52%, #2a0730 100%);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 14px;
    padding: 18px 20px 20px;
    margin-bottom: 22px;
    position: relative;
    overflow: hidden;
  }
  header.top::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: linear-gradient(90deg, #00ff87 0%, #04f5ff 42%, #963cff 72%, #e90052 100%);
  }
  header.top h1  { color: #ffffff; }
  header.top .sub { color: rgba(255,255,255,0.80); }
  header.top button.ghost {
    background: rgba(255,255,255,0.12); color: #ffffff;
    border-color: rgba(255,255,255,0.30);
  }
  header.top button.ghost:hover { background: rgba(255,255,255,0.20); }

  /* Tabs: the selected one carries the brand green underneath. */
  nav.tabs button[aria-selected="true"] {
    background: color-mix(in srgb, var(--accent) 14%, var(--surface-1));
    border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  }

  /* Table headers sit under a green rule; rows band gently and light up on
     hover so a finger or cursor never loses its place across a wide row. */
  th { border-bottom: 2px solid color-mix(in srgb, var(--accent) 50%, var(--grid)); }
  tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--text-primary) 3.5%, transparent); }
  tbody tr:hover td { background: color-mix(in srgb, var(--accent) 9%, transparent); }
  /* The top five are the prize places, so they get a quiet green wash and a
     single edge marker on the row - the marker goes on the first cell only,
     or it repeats as a bar between every column. */
  tr.me td {
    background: color-mix(in srgb, var(--accent) 9%, transparent) !important;
  }
  tr.me td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  /* Keep the first column clear of that edge marker - applied to every row so
     the column stays aligned above and below the highlighted one. Tables
     without a rank column start with a name, which was getting clipped. */
  td:first-child, th:first-child { padding-left: 10px; }
  td.pos { width: 44px; }

  /* KPI tiles: a thin brand stripe, cycled in fixed order so a tile keeps its
     colour as the season goes on. */
  .kpi { position: relative; overflow: hidden; }
  .kpi::before {
    content: ''; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: var(--accent);
  }
  .kpi:nth-child(2)::before { background: var(--accent-2); }
  .kpi:nth-child(3)::before { background: #963cff; }
  .kpi:nth-child(4)::before { background: #e90052; }
  .kpi:nth-child(5)::before { background: var(--series-5); }

  /* Cards get a faint purple lift off the page rather than a flat slab. */
  .card, .kpi {
    background:
      linear-gradient(180deg, color-mix(in srgb, var(--brand-purple) 6%, transparent) 0%, transparent 90px),
      var(--surface-1);
  }

  .medal { box-shadow: 0 0 0 1px rgba(0,0,0,0.18) inset; }

  /* Sponsor lockup in the masthead. The logo is navy on transparent, which
     would vanish against the purple, so it sits on a white plate - that also
     keeps the brand colours correct rather than recolouring someone's logo. */
  /* Prize-page note about the sponsored vouchers. Given it concerns money, it
     gets a marker rather than sitting in the grey small print. */
  .sponsor-note {
    margin: 0 0 14px; padding: 9px 12px; border-radius: 8px;
    border-left: 3px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    color: var(--text-secondary); font-size: 12.5px; line-height: 1.5;
  }

  .sponsor { display: flex; align-items: center; gap: 10px; align-self: center; }
  .sponsor-label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em;
    color: rgba(255,255,255,0.7); white-space: nowrap; font-weight: 600;
  }
  .sponsor-logo {
    display: block; background: #ffffff; border-radius: 8px;
    padding: 9px 13px; line-height: 0;
    box-shadow: 0 1px 5px rgba(0,0,0,0.28);
    transition: transform .12s ease;
  }
  .sponsor-logo:hover { transform: translateY(-1px); }
  .sponsor-logo:focus-visible { outline: 2px solid #00ff87; outline-offset: 3px; }
  .sponsor-logo img { display: block; height: 38px; width: auto; }

  @media (max-width: 860px) {
    .sponsor-logo img { height: 30px; }
    .sponsor-label { font-size: 10px; }
  }
  @media (max-width: 560px) {
    header.top { padding: 15px 16px 17px; border-radius: 12px; }
    /* On a phone the masthead stacks; keep the sponsor on its own line rather
       than squeezed against the theme toggle. */
    .sponsor { order: 3; width: 100%; margin-top: 4px; }
    .spacer { display: none; }
  }

  /* On a phone a six-column table is wider than the screen. Let the card
     scroll sideways rather than the whole page, which otherwise shifts the
     header and nav out of view too. */
  @media (max-width: 760px) {
    .card { overflow-x: auto; }
    .card > table { min-width: 460px; }
  }
</style>
</head>
<body>

      <div class="sub" id="leagueSub"></div>

    <div class="spacer"></div>

    <button class="ghost" id="themeBtn" type="button">Dark</button>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <section class="panel" id="p-overview"></section>
  <section class="panel" id="p-month"></section>
  <section class="panel" id="p-season"></section>
  <section class="panel" id="p-shame"></section>
  <section class="panel" id="p-squads"></section>
  <section class="panel" id="p-cup"></section>
  <section class="panel" id="p-prizes"></section>
  <section class="panel" id="p-email"></section>

  <div class="foot">
    <span id="stamp"></span>
    <span class="spacer"></span>
    <span>Data: official Fantasy Premier League API</span>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================ utilities */
const $ = (s, r=document) => r.querySelector(s);
const el = (t, a={}, ...kids) => {
  const n = document.createElement(t);
  for (const [k,v] of Object.entries(a)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  kids.flat().forEach(c => {
    if (c === null || c === undefined || c === false) return;
    n.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  });
  return n;
};
const SVGNS = 'http://www.w3.org/2000/svg';
const svgEl = (t, a={}) => {
  const n = document.createElementNS(SVGNS, t);
  for (const [k,v] of Object.entries(a)) if (v !== null && v !== undefined) n.setAttribute(k, v);
  return n;
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ord = n => { const s=['th','st','nd','rd'], v=n%100; return n + (s[(v-20)%10] || s[v] || s[0]); };
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('en-GB',
  {weekday:'short', day:'numeric', month:'short', year:'numeric'}) : '—';
const fmtDateTime = iso => iso ? new Date(iso).toLocaleString('en-GB',
  {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : '—';
const CHIP = {'3xc':'Triple Captain','bboost':'Bench Boost','freehit':'Free Hit',
              'wildcard':'Wildcard','manager':'Assistant Manager'};
// Bumped whenever index.html changes. Printed in the footer so a glance at the
// live site confirms which build is deployed - no view-source needed.
const SITE_VERSION = '10';

const SERIES = ['--series-1','--series-2','--series-3','--series-4','--series-5'];
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1900); }

let DATA = null, MONEY = (n)=>n;

/* ============================================================ chart: rank race */
function rankRace(container, mode, focusEntry) {
  const mgrs = DATA.managers.filter(m => m.history.some(h => h.league_pos));
  if (!mgrs.length) return container.appendChild(el('div',{class:'empty'},
    el('div',{class:'big'},'No gameweeks completed yet'),
    el('div',{},'The race chart appears once Gameweek 1 has been scored.')));

  const gws = [...new Set(mgrs.flatMap(m => m.history.filter(h=>h.league_pos).map(h=>h.gw)))].sort((a,b)=>a-b);
  const N = DATA.managers.length;
  const W = 900, H = Math.max(300, Math.min(520, 90 + N*17));
  const M = {t:16, r:132, b:34, l:34};
  const iw = W-M.l-M.r, ih = H-M.t-M.b;
  const x = gw => M.l + (gws.length<2 ? iw/2 : iw * (gws.indexOf(gw)/(gws.length-1)));
  const y = pos => M.t + ih * ((pos-1)/Math.max(N-1,1));   // 1st at the top

  const svg = svgEl('svg', {class:'chart', viewBox:`0 0 ${W} ${H}`,
                            role:'img', 'aria-label':'League position by gameweek'});

  // gridlines: positions 1, 5, 10, 15, 20…
  const ticks = [1, ...Array.from({length:N}, (_,i)=>i+1).filter(p=>p%5===0)];
  ticks.forEach(p => {
    svg.appendChild(svgEl('line',{class:'gridline', x1:M.l, x2:M.l+iw, y1:y(p), y2:y(p)}));
    const t = svgEl('text',{class:'ticklabel', x:M.l-8, y:y(p)+4, 'text-anchor':'end'});
    t.textContent = ord(p); svg.appendChild(t);
  });
  const step = gws.length > 20 ? 5 : (gws.length > 10 ? 2 : 1);
  gws.filter((g,i)=> i===0 || i===gws.length-1 || g%step===0).forEach(g => {
    const t = svgEl('text',{class:'ticklabel', x:x(g), y:H-12, 'text-anchor':'middle'});
    t.textContent = 'GW'+g; svg.appendChild(t);
  });
  svg.appendChild(svgEl('line',{class:'axisline', x1:M.l, x2:M.l, y1:M.t, y2:M.t+ih}));

  const path = m => m.history.filter(h=>h.league_pos)
    .map((h,i)=> `${i?'L':'M'}${x(h.gw).toFixed(1)},${y(h.league_pos).toFixed(1)}`).join('');

  const tip = el('div',{class:'tooltip'});
  container.style.position = 'relative';
  container.appendChild(tip);

  const showTip = (m, evt) => {
    const last = m.history.filter(h=>h.league_pos).slice(-1)[0];
    tip.innerHTML = `<strong>${esc(m.manager)}</strong><br>${esc(m.team)}<br>` +
      `${ord(last.league_pos)} · ${last.total} pts`;
    const r = container.getBoundingClientRect();
    tip.style.left = Math.min(evt.clientX - r.left + 14, r.width - 170) + 'px';
    tip.style.top  = (evt.clientY - r.top - 10) + 'px';
    tip.style.opacity = 1;
  };

  const highlight = [];
  if (mode === 'top5') {
    mgrs.slice().sort((a,b)=>b.total-a.total).slice(0,5)
        .forEach((m,i)=> highlight.push({m, color: cssv(SERIES[i])}));
  } else {
    const f = mgrs.find(m=>m.entry===focusEntry) || mgrs.slice().sort((a,b)=>b.total-a.total)[0];
    if (f) highlight.push({m:f, color: cssv('--series-1')});
  }
  const hiIds = new Set(highlight.map(h=>h.m.entry));

  // context lines first, so the highlighted ones sit on top
  mgrs.filter(m=>!hiIds.has(m.entry)).forEach(m => {
    const p = svgEl('path',{class:'ctxline', d:path(m)});
    p.addEventListener('mousemove', e=>showTip(m,e));
    p.addEventListener('mouseleave', ()=> tip.style.opacity=0);
    p.addEventListener('click', ()=> { render('overview',{focus:m.entry, mode:'one'}); });
    svg.appendChild(p);
  });

  highlight.forEach(({m,color}) => {
    svg.appendChild(svgEl('path',{class:'hiline', d:path(m), stroke:color}));
    const pts = m.history.filter(h=>h.league_pos);
    if (gws.length <= 24) pts.forEach(h =>
      svg.appendChild(svgEl('circle',{class:'himark', cx:x(h.gw), cy:y(h.league_pos),
                                      r:4, fill:color})));
    const last = pts.slice(-1)[0];
    const lab = svgEl('text',{class:'endlabel', x:x(last.gw)+10, y:y(last.league_pos)+4, fill:color});
    lab.textContent = m.manager.split(' ')[0] + ' · ' + ord(last.league_pos);
    svg.appendChild(lab);
  });

  container.appendChild(svg);
  if (mode === 'top5') {
    const lg = el('div',{class:'legend'});
    highlight.forEach(({m,color}) => lg.appendChild(el('span',{class:'k'},
      el('span',{class:'swatch', style:`background:${color}`}), `${m.manager} — ${m.team}`)));
    container.appendChild(lg);
  }
}

/* ============================================================ chart: bar */
function barChart(container, rows, valueKey, opts={}) {
  if (!rows.length) return;
  const H_ROW = 26, W = 900, M = {t:8, r:56, b:8, l:opts.labelWidth ?? 168};
  const H = M.t + rows.length*H_ROW + M.b;
  const iw = W - M.l - M.r;
  const max = Math.max(...rows.map(r=>Math.abs(r[valueKey])), 1);
  const svg = svgEl('svg',{class:'chart', viewBox:`0 0 ${W} ${H}`, role:'img',
                           'aria-label': opts.label || 'Bar chart'});
  const tip = el('div',{class:'tooltip'});
  container.style.position='relative'; container.appendChild(tip);

  rows.forEach((r,i) => {
    const cy = M.t + i*H_ROW, bh = 16, by = cy + (H_ROW-bh)/2;
    const w = Math.max(2, iw * (Math.abs(r[valueKey])/max));
    const lab = svgEl('text',{class:'ticklabel', x:M.l-12, y:by+12, 'text-anchor':'end',
                              fill:'var(--text-secondary)', 'font-size':12.5});
    lab.textContent = r.label; svg.appendChild(lab);
    const bar = svgEl('rect',{class:'bar', x:M.l, y:by, width:w, height:bh,
                              fill: r.color || opts.color || 'var(--seq-400)'});
    bar.addEventListener('mousemove', e=>{
      tip.innerHTML = `<strong>${esc(r.label)}</strong><br>${esc(r.tip || (r[valueKey]+' pts'))}`;
      const b=container.getBoundingClientRect();
      tip.style.left=Math.min(e.clientX-b.left+14,b.width-170)+'px';
      tip.style.top=(e.clientY-b.top-10)+'px'; tip.style.opacity=1;
    });
    bar.addEventListener('mouseleave',()=>tip.style.opacity=0);
    svg.appendChild(bar);
    const v = svgEl('text',{x:M.l+w+8, y:by+12, 'font-size':12.5, 'font-weight':600,
                            fill:'var(--text-secondary)'});
    v.textContent = r[valueKey]; svg.appendChild(v);
  });
  container.appendChild(svg);
}

/* ============================================================ shared bits */
function medal(rank){
  if (rank>3) return el('span',{class:'pos'}, String(rank));
  return el('span',{class:`medal m${rank}`}, String(rank));
}
/* A manager's own FPL page. Mid-season the gameweek view is the interesting
   one - it shows the actual eleven they picked - but that URL does not exist
   before a gameweek has been scored, so fall back to their season history. */
function fplTeamUrl(entry){
  const gw = DATA.current_gw;
  return gw ? `https://fantasy.premierleague.com/entry/${entry}/event/${gw}`
            : `https://fantasy.premierleague.com/entry/${entry}/history`;
}

/* Pass an entry id to make the name a link. The Hall of Fame & Shame tables
   deliberately do not, so they stay plain text. */
function nameCell(manager, team, entry){
  const name = entry
    ? el('a',{class:'who mlink', href:fplTeamUrl(entry), target:'_blank',
              rel:'noopener noreferrer', title:`${manager} on the FPL site`}, manager)
    : el('div',{class:'who'}, manager);
  return el('td',{}, name, el('div',{class:'teamname'}, team));
}
function table(headers, rows){
  const t = el('table');
  const thead = el('thead'); const tr = el('tr');
  headers.forEach(h => tr.appendChild(el('th',{class: h.num?'num':''}, h.label ?? h)));
  thead.appendChild(tr); t.appendChild(thead);
  const tb = el('tbody'); rows.forEach(r => tb.appendChild(r)); t.appendChild(tb);
  return t;
}
function card(title, note, ...body){
  const c = el('div',{class:'card'}, el('h2',{},title));
  if (note) c.appendChild(el('p',{class:'note'}, note));
  body.flat().forEach(b => b && c.appendChild(b));
  return c;
}
function emptyState(big, small){
  return el('div',{class:'empty'}, el('div',{class:'big'},big), el('div',{},small));
}

/* ============================================================ panels */
const state = { tab:'overview', focus:null, raceMode:'one', month:null, cupRound:null, hallScope:'season' };

function render(tab, opts={}){
  if (tab) state.tab = tab;
  Object.assign(state, opts);
  document.querySelectorAll('nav.tabs button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.tab === state.tab)));
  document.querySelectorAll('section.panel').forEach(p =>
    p.classList.toggle('active', p.id === 'p-'+state.tab));
  const host = $('#p-'+state.tab);
  host.innerHTML = '';
  ({overview:pOverview, month:pMonth, season:pSeason, shame:pShame,
    squads:pSquads, cup:pCup, prizes:pPrizes, email:pEmail}[state.tab])(host);
  window.scrollTo({top:0, behavior:'instant'});
}

/* ---------- overview */
function pOverview(host){
  const d = DATA;
  const started = d.current_gw > 0;
  const leader = d.top5[0];
  const done = d.months.filter(m=>m.complete);
  const latest = done[done.length-1];

  const kpis = el('div',{class:'kpis'});
  const kpi = (label, value, meta) => kpis.appendChild(
    el('div',{class:'kpi'}, el('div',{class:'label'},label),
      el('div',{class:'value'},value), meta?el('div',{class:'meta'},meta):''));

  kpi('League leader', started ? leader.manager : '—',
      started ? `${leader.team} · ${leader.total} pts` : 'Season not started');
  kpi('Gameweek', started ? String(d.current_gw) : 'Pre-season',
      d.next_deadline ? 'Next deadline ' + fmtDateTime(d.next_deadline) : 'Season complete');
  kpi('Latest Manager of the Month',
      latest && latest.winner ? latest.winner.manager : '—',
      latest && latest.winner ? `${latest.short} · ${latest.winner[d.basis]} pts`
                              : 'First award after the opening month');

  // biggest mover across the last gameweek
  let mover = null;
  if (d.current_gw > 1){
    d.managers.forEach(m => {
      const h = m.history;
      const now = h.find(x=>x.gw===d.current_gw), prev = h.find(x=>x.gw===d.current_gw-1);
      if (now?.league_pos && prev?.league_pos){
        const diff = prev.league_pos - now.league_pos;
        if (!mover || diff > mover.diff) mover = {m, diff};
      }
    });
  }
  kpi('Biggest climber', mover && mover.diff>0 ? mover.m.manager : '—',
      mover && mover.diff>0 ? `Up ${mover.diff} place${mover.diff>1?'s':''} in GW${d.current_gw}`
                            : 'Nothing to report yet');
  host.appendChild(kpis);

  // rank race
  const ctrl = el('div',{class:'controls'});
  const seg = el('div',{class:'seg'});
  [['one','Highlight one'],['top5','Top 5']].forEach(([k,lbl])=>{
    seg.appendChild(el('button',{type:'button','aria-pressed':String(state.raceMode===k),
      onclick:()=>render('overview',{raceMode:k})}, lbl));
  });
  ctrl.appendChild(seg);
  if (state.raceMode === 'one' && started){
    const sel = el('select',{onchange:e=>render('overview',{focus:+e.target.value})});
    d.managers.slice().sort((a,b)=>a.manager.localeCompare(b.manager)).forEach(m=>
      sel.appendChild(el('option',{value:m.entry,
        selected: m.entry===(state.focus ?? d.top5[0]?.entry) ? '' : null},
        `${m.manager} — ${m.team}`)));
    ctrl.appendChild(sel);
  }
  const race = el('div',{class:'chartwrap'});
  const c = card('The race for the title',
    started ? 'League position after every gameweek. Every manager is drawn; hover or pick one to bring it forward. Click any grey line to follow that manager.'
            : 'Positions plot here once the first gameweek is scored.',
    ctrl, race);
  host.appendChild(c);
  rankRace(race, state.raceMode, state.focus ?? d.top5[0]?.entry);

  // top 5
  if (started){
    const rows = d.top5.map(t => {
      const m = d.managers.find(x=>x.entry===t.entry);
      const mv = m.last_rank && m.rank ? m.last_rank - m.rank : 0;
      return el('tr',{},
        el('td',{class:'pos'}, medal(t.rank)),
        nameCell(t.manager, t.team, t.entry),
        el('td',{class:'num'}, mv===0?'–':el('span',{class: mv>0?'delta-up':'delta-dn'},
          (mv>0?'▲ ':'▼ ')+Math.abs(mv))),
        el('td',{class:'num'}, String(t.total)));
    });
    host.appendChild(card('Top 5 — the places that pay',
      'Prize positions as they stand. Movement is against last gameweek.',
      table(['#', 'Manager', {label:'Move',num:true}, {label:'Points',num:true}], rows)));
  } else {
    host.appendChild(card('Top 5 — the places that pay', null,
      emptyState(`${d.league.size} managers signed up`,
                 'Standings appear after the first gameweek is scored.')));
  }
}

/* ---------- month */
function pMonth(host){
  const d = DATA;
  const usable = d.months.filter(m=>m.table && m.table.length);
  if (!usable.length) return host.appendChild(card('Manager of the Month', null,
    emptyState('No completed gameweeks yet',
               'The first monthly table publishes the day after the last fixture of the month.')));

  const done = usable.filter(m=>m.complete);
  const key = state.month || (done.length ? done[done.length-1].key : usable[usable.length-1].key);
  const mo = usable.find(m=>m.key===key) || usable[0];

  const ctrl = el('div',{class:'controls'});
  const sel = el('select',{onchange:e=>render('month',{month:e.target.value})});
  usable.forEach(m => sel.appendChild(el('option',{value:m.key, selected: m.key===mo.key?'':null},
    m.label + (m.complete ? '' : ' — in progress'))));
  ctrl.appendChild(sel);
  ctrl.appendChild(el('span',{class:'pill'}, 'GW ' + mo.gws.join(', ')));
  ctrl.appendChild(el('span',{class:'pill'},
    mo.complete ? 'Final · published ' + fmtDate(mo.publish_date)
                : 'Provisional · finalises ' + fmtDate(mo.publish_date)));
  host.appendChild(ctrl);

  if (mo.complete && mo.winner){
    const w = mo.winner;
    const kpis = el('div',{class:'kpis'});
    kpis.appendChild(el('div',{class:'kpi'},
      el('div',{class:'label'}, mo.label + ' — Manager of the Month'),
      el('div',{class:'value'}, w.manager),
      el('div',{class:'meta'}, `${w.team} · ${w[d.basis]} points`)));
    if (mo.stats){
      kpis.appendChild(el('div',{class:'kpi'}, el('div',{class:'label'},'League average'),
        el('div',{class:'value'}, String(mo.stats.avg)),
        el('div',{class:'meta'}, `Best ${mo.stats.best} · worst ${mo.stats.worst}`)));
      kpis.appendChild(el('div',{class:'kpi'}, el('div',{class:'label'},'Points binned on the bench'),
        el('div',{class:'value'}, String(mo.stats.total_bench)),
        el('div',{class:'meta'}, 'Across the whole league')));
      kpis.appendChild(el('div',{class:'kpi'}, el('div',{class:'label'},'Lost to transfer hits'),
        el('div',{class:'value'}, String(mo.stats.total_hits)),
        el('div',{class:'meta'}, mo.stats.total_hits ? 'Ouch' : 'Model discipline')));
    }
    host.appendChild(kpis);
  }

  const chart = el('div',{class:'chartwrap'});
  host.appendChild(card(mo.label + ' table',
    `Scored on ${d.basis === 'net' ? 'net points — transfer hits deducted, exactly as the league table works'
                                   : 'gross points, before transfer hits'}.`,
    chart));
  barChart(chart, mo.table.slice(0,20).map((r,i)=>({
    label: r.manager, [d.basis]: r[d.basis],
    tip: `${r.gross} gross${r.hits?` − ${r.hits} hits`:''} · ${r.bench} on the bench`,
    color: i===0 ? 'var(--series-1)' : 'var(--seq-250)'
  })), d.basis, {label: mo.label + ' points'});

  const rows = mo.table.map(r => el('tr',{},
    el('td',{class:'pos'}, medal(r.rank)),
    nameCell(r.manager, r.team, r.entry),
    el('td',{class:'num'}, String(r.gross)),
    el('td',{class:'num'}, r.hits ? el('span',{class:'delta-dn'}, '−'+r.hits) : '0'),
    el('td',{class:'num'}, String(r.net)),
    el('td',{class:'num'}, String(r.bench)),
    el('td',{}, (r.chips||[]).map(c=>el('span',{class:'pill'}, CHIP[c]||c)))));
  host.appendChild(card('Full month standings', null,
    table(['#','Manager',{label:'Gross',num:true},{label:'Hits',num:true},
           {label:'Net',num:true},{label:'Bench',num:true},'Chips'], rows)));

  const won = d.months.filter(m=>m.complete && m.winner);
  if (won.length){
    host.appendChild(card('Every Manager of the Month so far', null,
      table(['Month','Winner',{label:'Points',num:true},'Gameweeks'],
        won.map(m => el('tr',{},
          el('td',{}, m.label),
          nameCell(m.winner.manager, m.winner.team, m.winner.entry),
          el('td',{class:'num'}, String(m.winner[d.basis])),
          el('td',{}, 'GW ' + m.gws.join(', ')))))));
  }
}

/* ---------- season */
function pSeason(host){
  const d = DATA;
  if (!d.current_gw) return host.appendChild(card('Season standings', null,
    emptyState(`${d.league.size} managers signed up`, 'The table fills in after Gameweek 1.')));

  const rows = d.managers.slice().sort((a,b)=>a.rank-b.rank).map(m => {
    const mv = m.last_rank && m.rank ? m.last_rank - m.rank : 0;
    const last = m.history[m.history.length-1];
    return el('tr',{class: m.rank<=5 ? 'me':''},
      el('td',{class:'pos'}, medal(m.rank)),
      nameCell(m.manager, m.team, m.entry),
      el('td',{class:'num'}, mv===0?'–':el('span',{class:mv>0?'delta-up':'delta-dn'},
        (mv>0?'▲ ':'▼ ')+Math.abs(mv))),
      el('td',{class:'num'}, last ? String(last.net) : '–'),
      el('td',{class:'num'}, String(m.season.best_gw)),
      el('td',{class:'num'}, String(m.season.bench_total)),
      el('td',{class:'num'}, m.season.hits_total ? el('span',{class:'delta-dn'},'−'+m.season.hits_total) : '0'),
      el('td',{class:'num'}, '£'+m.season.team_value.toFixed(1)+'m'),
      el('td',{class:'num'}, String(m.total)));
  });
  host.appendChild(card('Season standings',
    'The top five at the final whistle take the season prizes.',
    table(['#','Manager',{label:'Move',num:true},{label:'Last GW',num:true},
           {label:'Best GW',num:true},{label:'Bench',num:true},{label:'Hits',num:true},
           {label:'Squad',num:true},{label:'Total',num:true}], rows)));

  const chips = d.managers.filter(m=>m.chips_used.length);
  if (chips.length){
    host.appendChild(card('Chips played', 'Who has burned what, and when.',
      table(['Manager','Chips used'], chips.map(m => el('tr',{},
        nameCell(m.manager, m.team, m.entry),
        el('td',{}, m.chips_used.map(c =>
          el('span',{class:'pill'}, `${CHIP[c.name]||c.name} · GW${c.gw}`))))))));
  }
}

/* ---------- hall of fame & shame */

/* Each entry drives one table. Keeping them as data rather than seven
   near-identical render functions means adding another is one line. */
function hallTableSpecs(){
  const t = (DATA.player_tables && DATA.player_tables.double_figure_threshold) || 10;
  return [
    {key:'disc',    title:'Disciplinary points', bad:true,
     note:'Three for a red, one for a yellow — counted only while the player was in your side.',
     cols:[{k:'disc',label:'Points'},{k:'yc',label:'Yellow'},{k:'rc',label:'Red'}]},
    {key:'goals',   title:'Goals scored',
     note:'Goals scored by players who were in your line-up at the time.',
     cols:[{k:'goals',label:'Goals'}]},
    {key:'assists', title:'Assists',
     note:'The unselfish half of an attacking return.',
     cols:[{k:'assists',label:'Assists'}]},

    {key:'dbl',     title:'Double-figure hauls',

     cols:[{k:'dbl',label:'Hauls'}]},

/* Sum the compact per-gameweek arrays into one row per manager, either across
   the whole season or for a single gameweek. */
function hallRows(scope){
  const pt = DATA.player_tables;
  return pt.managers.map(m => {
    const acc = {};
    pt.keys.forEach(k => acc[k] = 0);
    const gws = scope === 'season' ? Object.keys(m.per_gw) : [String(scope)];
    gws.forEach(g => {
      const arr = m.per_gw[g];
      if (arr) pt.keys.forEach((k,i) => acc[k] += arr[i]);
    });
    return Object.assign({manager:m.manager, team:m.team}, acc);
  });
}

function hallStatCard(spec, rows){
  const ranked = rows.slice().sort((a,b) => b[spec.key] - a[spec.key]).slice(0, 8);
  if (!ranked.length || ranked[0][spec.key] === 0) {
    return card(spec.title, spec.note, emptyState('Nothing to report yet','No returns in this period.'));
  }
  const headers = ['Manager'].concat(spec.cols.map(c => ({label:c.label, num:true})));
  return card(spec.title, spec.note, table(headers, ranked.map((r,i) =>
    el('tr', {class: i === 0 ? 'me' : ''},
      nameCell(r.manager, r.team),
      spec.cols.map(c => el('td',{class:'num'},
        el('span',{class: (spec.bad && c.k === spec.key && r[c.k] > 0) ? 'delta-dn' : ''},
          String(r[c.k]))))))));
}

function hallPositionCard(rows){
  const withTotal = rows.map(r => Object.assign({}, r,
    {tot: r.p_gk + r.p_def + r.p_mid + r.p_fwd}));
  withTotal.sort((a,b) => b.tot - a.tot);
  if (!withTotal.length || withTotal[0].tot === 0) {
    return card('Points by position', 'Where each manager is winning their points.',
      emptyState('No points banked yet','This fills in once a gameweek is scored.'));
  }
  return card('Points by position',
    'Where each manager is actually winning their points. Every manager, not just the top eight.',
    table(['Manager',{label:'GK',num:true},{label:'DEF',num:true},{label:'MID',num:true},
           {label:'FWD',num:true},{label:'Total',num:true}],
      withTotal.map((r,i) => el('tr',{class: i === 0 ? 'me' : ''},
        nameCell(r.manager, r.team),
        el('td',{class:'num'}, String(r.p_gk)),
        el('td',{class:'num'}, String(r.p_def)),
        el('td',{class:'num'}, String(r.p_mid)),
        el('td',{class:'num'}, String(r.p_fwd)),
        el('td',{class:'num'}, el('strong',{}, String(r.tot)))))));
}

function hallBand(title, note, shame){
  return el('div',{class: shame ? 'hallband shame' : 'hallband'},
    el('h2',{}, title), note ? el('p',{}, note) : null);
}

function hallGrid(cls, cards){
  const g = el('div',{class:cls});
  cards.filter(Boolean).forEach(c => g.appendChild(c));
  return g;
}

/* ---------- cup */
function buildCupEmailHTML(r){
  const S = 'font-family:system-ui,-apple-system,Segoe UI,sans-serif;';
  const played = r.matches.filter(m => !m.bye && m.margin !== null);
  let h = `<div style="${S}max-width:640px;color:#0b0b0b">`;
  h += `<h2 style="margin:0 0 2px;font-size:20px">${esc(DATA.league.name)} — Cup</h2>`;
  h += `<div style="color:#52514e;font-size:14px;margin-bottom:18px">${esc(r.label)} · Gameweek ${r.event}</div>`;

  const lines = [];
  const told = new Set();          // tie ids already covered, so nothing repeats
  const sides = m => m.winner === m.home.entry ? [m.home, m.away] : [m.away, m.home];

  // A thrashing is worth calling out; only claim it was the worst of the round
  // when there were enough other ties for that to mean anything.
  if (r.biggest_win && played.length >= 2 && r.biggest_win.margin >= 15){
    const [w,l] = sides(r.biggest_win);
    const tail = played.length >= 3 ? ' — the least competitive tie of the round.' : '.';
    lines.push(`<strong>${esc(w.manager)}</strong> put ${r.biggest_win.margin} points on `+
               `${esc(l.manager)} (${w.points}–${l.points})${tail}`);
    told.add(r.biggest_win.id);
  }

  // Only describe the closest tie as close if it actually was.
  if (r.closest && !told.has(r.closest.id)){
    const [w,l] = sides(r.closest);
    const m = r.closest.margin;
    if (m === 0)
      lines.push(`<strong>${esc(w.manager)}</strong> and ${esc(l.manager)} finished level on ${w.points}; the tiebreaker sent ${esc(w.manager)} through.`);
    else if (m <= 5)
      lines.push(`<strong>${esc(w.manager)}</strong> squeezed past ${esc(l.manager)} by ${m} point${m===1?'':'s'} (${w.points}–${l.points}).`);
    else if (played.length >= 3)
      lines.push(`The tightest tie of the round still went ${m} points: <strong>${esc(w.manager)}</strong> over ${esc(l.manager)} (${w.points}–${l.points}).`);
    else
      lines.push(`<strong>${esc(w.manager)}</strong> saw off ${esc(l.manager)} ${w.points}–${l.points}.`);
    told.add(r.closest.id);
  }

  (r.upsets||[]).forEach(u => {
    if (told.has(u.id)) return;
    lines.push(`${esc(u.winner)} (${ord(u.winner_seed)} in the league) knocked out `+
               `${esc(u.loser)} (${ord(u.loser_seed)}), ${u.score}.`);
  });

  if (lines.length){
    h += '<ul style="font-size:15px;line-height:1.6">' + lines.map(x=>`<li>${x}</li>`).join('') + '</ul>';
  }

  h += `<h3 style="font-size:15px;margin:22px 0 8px">${esc(r.label)} results</h3>`;
  h += `<table cellpadding="0" cellspacing="0" style="${S}border-collapse:collapse;width:100%;font-size:14px">`;
  played.forEach(m => {
    const hw = m.winner === m.home.entry, aw = m.winner === m.away.entry;
    const nm = (s, won) => won ? `<strong>${esc(s.manager)}</strong>` : `<span style="color:#898781">${esc(s.manager)}</span>`;
    h += `<tr><td style="padding:6px 8px 6px 0;border-bottom:1px solid #e1e0d9">${nm(m.home,hw)} v ${nm(m.away,aw)}</td>`+
         `<td style="text-align:right;padding:6px 0;border-bottom:1px solid #e1e0d9;white-space:nowrap">${m.home.points}–${m.away.points}</td></tr>`;
  });
  h += '</table>';

  if (r.survivors && r.survivors.length){
    h += `<p style="font-size:15px;line-height:1.55;margin-top:18px"><strong>Through to the next round:</strong> ${r.survivors.map(esc).join(', ')}.</p>`;
  }
  h += `<p style="color:#898781;font-size:12.5px;margin-top:24px">Full bracket: <a href="${location.href.split('#')[0]}">${esc(location.host + location.pathname)}</a></p>`;
  return h + '</div>';
}

function pCup(host){
  const c = DATA.cup;
  if (c.status !== 'active' || !c.rounds.length){
    return host.appendChild(card('The Cup', null, emptyState(
      'The cup has not been drawn yet',
      c.message || 'Fixtures appear automatically once FPL makes the draw.')));
  }

  const wrap = el('div',{class:'bracket'});
  c.rounds.forEach(r => {
    const col = el('div',{class:'round'}, el('h3',{}, `${r.label} · GW${r.event}`));
    r.matches.forEach(m => {
      // A future round shows "TBC" until the draw is made, and a bye has no
      // entry either - both fall back to plain text rather than a dead link.
      const side = (s, won) => el('div',{class:'side '+(won?'win':'lose')},
        (s && s.entry)
          ? el('a',{class:'mlink', href:fplTeamUrl(s.entry), target:'_blank',
                    rel:'noopener noreferrer'}, s.manager || s.team || 'TBC')
          : el('span',{}, (s && (s.manager || s.team)) || 'TBC'),
        el('span',{class:'pts'}, s.points ?? '–'));
      col.appendChild(el('div',{class:'tie'},
        side(m.home, m.winner===m.home.entry),
        side(m.away, m.winner===m.away.entry)));
    });
    wrap.appendChild(col);
  });
  host.appendChild(card('Knockout cup',
    `Straight knockout on gameweek score${c.start_event?`, from Gameweek ${c.start_event}`:''}. `+
    'Ties are settled by FPL’s own tiebreakers.', wrap));

  // Per-round bulletin, for the weekly email while the cup is running.
  const done = c.rounds.filter(r => r.complete);
  if (!done.length){
    return host.appendChild(card('Weekly cup bulletin', null, emptyState(
      'This round is still being played',
      'The bulletin appears as soon as FPL finalises the gameweek.')));
  }
  const key = state.cupRound ?? done[done.length-1].event;
  const r = done.find(x=>x.event===key) || done[done.length-1];

  const sel = el('select',{onchange:e=>render('cup',{cupRound:+e.target.value})});
  done.forEach(x => sel.appendChild(el('option',{value:x.event, selected:x.event===r.event?'':null},
    `${x.label} — GW${x.event}`)));

  const html = buildCupEmailHTML(r);
  const box = el('div',{class:'emailbox', html});
  const ctrl = el('div',{class:'controls'}, sel,
    el('button',{class:'ghost', type:'button', onclick: async ()=>{
      try {
        await navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([html],{type:'text/html'}),
          'text/plain': new Blob([box.innerText],{type:'text/plain'})})]);
        toast('Cup bulletin copied — paste straight into your email');
      } catch {
        await navigator.clipboard.writeText(box.innerText); toast('Copied as plain text');
      }
    }}, 'Copy this round'),
    el('button',{class:'ghost', type:'button', onclick: async ()=>{
      await navigator.clipboard.writeText(box.innerText); toast('Copied as plain text');
    }}, 'Copy plain text'));

  host.appendChild(card('Weekly cup bulletin',
    'One per round, written from the results. Copy and send it the day after the gameweek finalises.',
    ctrl, box));
}

/* ---------- email */
/* Render one table to a PNG.

   Email clients stretch real <table> markup to the width of the compose
   window, which is what was mangling the columns on paste. A picture cannot be
   reflowed, so it arrives looking exactly as it does here. Drawn at 2x so it
   stays sharp on a phone, and a plain-text version travels alongside it for the
   text-only copy button. */
function tableImage(title, headers, rows){
  const SCALE = 2, MAXW = 600, GAP = 18;
  const INK = '#0b0b0b', MUTE = '#7a7a75', RULE = '#e1e0d9', HEAD = '#8a8a84';
  const font = (w,sz) => `${w} ${sz}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');

  const asCell = c => (c && typeof c === 'object') ? c : {main: String(c ?? '')};
  const grid = rows.map(r => r.map(asCell));
  const lastCol = headers.length - 1;
  const rightAligned = i => i === lastCol;

  // Natural column widths - the table is only ever as wide as it needs to be.
  const w = headers.map(h => { ctx.font = font(600,11);
    return ctx.measureText(String(h).toUpperCase()).width + 2; });
  grid.forEach(r => r.forEach((c,i) => {
    ctx.font = font(c.sub ? 700 : 400, 14);
    w[i] = Math.max(w[i], ctx.measureText(c.main).width);
    if (c.sub){ ctx.font = font(400,12.5); w[i] = Math.max(w[i], ctx.measureText(c.sub).width); }
  }));
  // The heading sits above the columns, so it has to be measured too - a long
  // month name was being cut off the right-hand edge.
  ctx.font = font(650,15);
  const titleW = title ? ctx.measureText(title).width + 2 : 0;

  // Every table gets the same width, so a run of them reads as one set rather
  // than a ragged staircase. Slack goes to the widest text column; if the
  // natural width is over budget, that same column gives it back.
  const TARGET = Math.max(MAXW, Math.ceil(titleW));
  let total = w.reduce((a,b)=>a+b,0) + GAP * lastCol;
  const widest = w.indexOf(Math.max(...w));
  w[widest] = Math.max(60, w[widest] + (TARGET - total));
  total = w.reduce((a,b)=>a+b,0) + GAP * lastCol;

  const rowH = grid.map(r => r.some(c=>c.sub) ? 40 : 29);
  const titleH = title ? 26 : 0, headH = 24;
  const H = titleH + headH + rowH.reduce((a,b)=>a+b,0) + 2;

  cv.width = Math.ceil(total*SCALE); cv.height = Math.ceil(H*SCALE);
  ctx.scale(SCALE, SCALE);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,total,H);

  let y = 0;
  if (title){ ctx.fillStyle = INK; ctx.font = font(650,15); ctx.textAlign='left';
              ctx.fillText(title, 0, 15); y = titleH; }

  const x = []; let acc = 0;
  headers.forEach((_,i)=>{ x[i] = acc; acc += w[i] + GAP; });

  ctx.font = font(600,11); ctx.fillStyle = HEAD;
  headers.forEach((h,i)=>{
    ctx.textAlign = rightAligned(i) ? 'right' : 'left';
    ctx.fillText(String(h).toUpperCase(), rightAligned(i) ? x[i]+w[i] : x[i], y+13);
  });
  ctx.strokeStyle = '#c3c2b7'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, y+headH-3.5); ctx.lineTo(total, y+headH-3.5); ctx.stroke();
  y += headH;

  grid.forEach((r,ri)=>{
    r.forEach((c,i)=>{
      ctx.textAlign = rightAligned(i) ? 'right' : 'left';
      const px = rightAligned(i) ? x[i]+w[i] : x[i];
      ctx.fillStyle = c.muted ? MUTE : INK;
      ctx.font = font(c.sub ? 700 : 400, 14);
      ctx.fillText(c.main, px, y + (c.sub ? 16 : 19));
      if (c.sub){ ctx.fillStyle = MUTE; ctx.font = font(400,12.5); ctx.fillText(c.sub, px, y+31); }
    });
    y += rowH[ri];
    ctx.strokeStyle = RULE;
    ctx.beginPath(); ctx.moveTo(0, y-0.5); ctx.lineTo(total, y-0.5); ctx.stroke();
  });

  return {url: cv.toDataURL('image/png'), width: Math.round(total)};
}

/* The same table as monospaced text, so the plain-text copy still carries the
   numbers rather than a row of missing images. */
function tableText(title, headers, rows){
  const asCell = c => (c && typeof c === 'object') ? c : {main: String(c ?? '')};
  const grid = rows.map(r => r.map(asCell));
  const flat = grid.map(r => r.map(c => c.sub ? `${c.main} (${c.sub})` : c.main));
  const w = headers.map((h,i) =>
    Math.max(String(h).length, ...flat.map(r => (r[i]||'').length)));
  const line = r => r.map((v,i) => i === headers.length-1
      ? String(v).padStart(w[i]) : String(v).padEnd(w[i])).join('  ').replace(/\s+$/,'');
  return `\n${title}\n${line(headers)}\n${w.map(n=>'-'.repeat(n)).join('  ')}\n`
       + flat.map(line).join('\n') + '\n';
}

function buildEmail(){
  const d = DATA;
  const done = d.months.filter(m=>m.complete);
  const mo = done[done.length-1];
  const w = d.commentary.written || {};
  const auto = d.commentary.auto || {};
  const key = mo ? mo.key : null;
  const hand = key && w[key] ? w[key] : null;
  const S = 'font-family:system-ui,-apple-system,Segoe UI,sans-serif;';
  const strip = t => t.replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>|<\/li>/gi,'\n')
                      .replace(/<li>/gi,'  - ').replace(/<[^>]+>/g,'')
                      .replace(/&amp;/g,'&').replace(/&nbsp;/g,' ').trim();

  let h = `<div style="${S}max-width:640px;color:#0b0b0b">`;
  let txt = '';

  const title = `${d.league.name}`;
  const sub = `${mo ? mo.label+' round-up' : 'Season preview'} · after Gameweek ${d.current_gw}`;
  h += `<h2 style="margin:0 0 2px;font-size:20px">${esc(title)}</h2>`;
  h += `<div style="color:#52514e;font-size:14px;margin-bottom:18px">${esc(sub)}</div>`;
  txt += `${title}\n${sub}\n`;

  let bodyHtml = '';
  if (hand && hand.body_html) bodyHtml = hand.body_html;
  else if (hand && hand.body) bodyHtml = `<p style="font-size:15px;line-height:1.55">${esc(hand.body).replace(/\n\n/g,'</p><p style="font-size:15px;line-height:1.55">')}</p>`;
  else if (auto.available){
    bodyHtml = `<p style="font-size:15px;line-height:1.55"><strong>${esc(auto.headline)}</strong></p><ul style="font-size:15px;line-height:1.6">`
      + (auto.bullets||[]).map(b=>`<li>${esc(b)}</li>`).join('') + `</ul>`;
  } else {
    bodyHtml = `<p style="font-size:15px">The season hasn't kicked off yet. ${d.league.size} managers are signed up and the first deadline is ${esc(fmtDateTime(d.next_deadline))}.</p>`;
  }
  h += bodyHtml;
  txt += '\n' + strip(bodyHtml) + '\n';

  const tbl = (t, headers, rows) => {
    if (!rows.length) return;
    const im = tableImage(t, headers, rows);
    h += `<img src="${im.url}" width="${im.width}" alt="${esc(t)}" `
       + `style="display:block;border:0;margin:22px 0 4px;width:${im.width}px;max-width:100%;height:auto">`;
    txt += tableText(t, headers, rows);
  };

  if (mo && mo.table.length){
    tbl(`${mo.label} — Manager of the Month`, ['#','Manager','Points'],
      mo.table.slice(0,5).map(r => [{main:String(r.rank), muted:true},
        {main:r.manager, sub:r.team}, String(r[d.basis])]));
  }
  if (d.top5.length){
    tbl('Overall top 5 — the places that pay', ['#','Manager','Total'],
      d.top5.map(t => [{main:String(t.rank), muted:true},
        {main:t.manager, sub:t.team}, String(t.total)]));
  }
  const hs = d.hall_of_shame;
  if (hs && hs.bench_season && hs.bench_season.length){
    tbl('Hall of Fame & Shame', ['Award','Recipient','Damage'], [
      ['Most points left on the bench', {main:hs.bench_season[0].manager}, hs.bench_season[0].points+' pts'],
      ...(hs.captain_flops.length ? [['Worst captain call',
        {main:hs.captain_flops[0].manager, sub:`${hs.captain_flops[0].player}, GW${hs.captain_flops[0].gw}`},
        hs.captain_flops[0].points+' pts']] : []),
      ...(hs.hits_season.length && hs.hits_season[0].points ? [['Most burned on transfer hits',
        {main:hs.hits_season[0].manager}, '-'+hs.hits_season[0].points+' pts']] : [])]);
  }
  if (d.cup.status === 'active' && d.cup.rounds.length){
    const last = d.cup.rounds[d.cup.rounds.length-1];
    tbl(`Cup — ${last.label}`, ['Tie','Score'], last.matches.map(m =>
      [`${m.home.manager||'TBC'} v ${m.away.manager||'TBC'}`,
       `${m.home.points ?? '-'} — ${m.away.points ?? '-'}`]));
  }
  const p = d.prizes;
  if (p.configured && p.running_totals.length){
    tbl('Prize money so far', ['Manager','Won'],
      p.running_totals.map(r => [{main:r.manager}, p.currency + r.amount]));
  }

  const link = location.href.split('#')[0];
  h += `<p style="color:#898781;font-size:12.5px;margin-top:26px">Full tables, charts and the Hall of Fame &amp; Shame: <a href="${link}">${esc(location.host + location.pathname)}</a></p>`;
  txt += `\nFull tables, charts and the Hall of Fame & Shame: ${link}\n`;
  return {html: h + '</div>', text: txt};
}

function pEmail(host){
  const {html, text} = buildEmail();
  const box = el('div',{class:'emailbox', html});
  const btns = el('div',{class:'controls'},
    el('button',{class:'ghost', type:'button', onclick: async ()=>{
      try {
        await navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([html], {type:'text/html'}),
          'text/plain': new Blob([text], {type:'text/plain'})})]);
        toast('Formatted round-up copied — paste straight into your email');
      } catch {
        await navigator.clipboard.writeText(text);
        toast('Copied as plain text');
      }
    }}, 'Copy formatted round-up'),
    el('button',{class:'ghost', type:'button', onclick: async ()=>{
      await navigator.clipboard.writeText(text); toast('Copied as plain text');
    }}, 'Copy plain text'),
    el('button',{class:'ghost', type:'button', onclick: ()=>window.print()}, 'Print / save as PDF'));

  host.appendChild(card('Monthly round-up — ready to send',
    'Everything below is formatted for email. The tables are images, so they keep their shape when pasted into Gmail or Outlook instead of stretching.',
    btns, box));

  const w = DATA.commentary.written || {};
  const done = DATA.months.filter(m=>m.complete);
  const mo = done[done.length-1];
  if (mo && !w[mo.key]){
    host.appendChild(card('Where the writing comes from',
      'This round-up is currently the auto-generated version, built from the numbers. '+
      'A hand-written edition drops into docs/commentary.json each month and replaces it automatically here.'));
  }
}

/* ============================================================ boot */
const TABS = [['overview','Overview'],['month','Manager of the Month'],['season','Season table'],
              ['shame','Hall of Fame & Shame'],['squads','Squads'],['cup','Cup'],
              ['prizes','Prize pot'],['email','Email round-up']];

function initTheme(){
  // Dark is the house style. A visitor who switches to light gets their choice
  // remembered on their own device; everyone else, and every first visit, sees
  // dark. Storage is wrapped because some embeds and private modes block it.
  const store = {
    get(){ try { return localStorage.getItem('fpl-theme'); } catch(e){ return null; } },
    set(v){ try { localStorage.setItem('fpl-theme', v); } catch(e){ /* no-op */ } },
  };
  const saved = store.get();
  document.documentElement.dataset.theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
  const btn = $('#themeBtn');
  const sync = () => btn.textContent = document.documentElement.dataset.theme === 'dark' ? 'Light' : 'Dark';
  btn.addEventListener('click', ()=>{
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    store.set(next);
    sync(); render(state.tab);
  });
  sync();
}

function start(data){
  DATA = data;
  $('#leagueName').textContent = data.league.name;
  const bits = [data.season, `${data.league.size} managers`];
  if (data.current_gw) bits.push(`after Gameweek ${data.current_gw}`);
  else bits.push('season starts soon');
  $('#leagueSub').textContent = bits.join(' · ');
  $('#stamp').textContent = 'Updated ' + new Date(data.generated_at)
    .toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})
    + ' · site v' + SITE_VERSION;
  const nav = $('#tabs');
  TABS.forEach(([k,label]) => nav.appendChild(
    el('button',{type:'button', role:'tab', 'data-tab':k, onclick:()=>render(k)}, label)));
  initTheme();
  render('overview');
}

(async function(){
  if (window.__FPL_DATA__) return start(window.__FPL_DATA__);
  try {
    const r = await fetch('data.json?t=' + Date.now());
    if (!r.ok) throw new Error(r.status);
    start(await r.json());
  } catch (e) {
    $('#leagueName').textContent = 'Could not load league data';
    $('#leagueSub').textContent =
      'data.json is missing or unreadable. The nightly job rebuilds it — check the Actions tab on GitHub.';
  }
})();
</script>
